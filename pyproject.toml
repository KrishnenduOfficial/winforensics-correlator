[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "winforensic-correlator"
version = "1.0.0"
description = "Multi-artifact Windows execution chaining and timestomp anomaly detection engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Krishnendu Bhattacherjee" }
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-registry>=1.3.0",
    "dissect.ntfs>=3.0.0",
    "pyesedb",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
wfcr = "wfcr:main"

[tool.setuptools]
py-modules = ["wfcr", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "models*", "parsers*", "utils*"]